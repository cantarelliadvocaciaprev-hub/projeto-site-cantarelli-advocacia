    <!-- Single Page Apps for GitHub Pages - Redirect Script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

    <!-- VLibras Widget (carregado sob demanda, fora do caminho crítico) -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script>
      (function () {
        // Acessibilidade: o widget VLibras injeta imagens sem alt
        function fixAlt() {
          var imgs = document.querySelectorAll('img:not([alt])');
          for (var i = 0; i < imgs.length; i++) {
            imgs[i].setAttribute('alt', 'VLibras - tradutor de Língua Brasileira de Sinais');
          }
        }
        function watchAlt() {
          fixAlt();
          new MutationObserver(fixAlt).observe(document.documentElement, { childList: true, subtree: true });
          var tries = 0;
          var t = setInterval(function () {
            fixAlt();
            if (++tries > 20) clearInterval(t);
          }, 500);
        }
        watchAlt();
        function loadVLibras() {
          var s = document.createElement('script');
          s.src = 'https://vlibras.gov.br/app/vlibras-plugin.js';
          s.async = true;
          s.onload = function () {
            if (window.VLibras) new window.VLibras.Widget('https://vlibras.gov.br/app');
          };
          document.body.appendChild(s);
        }

        window.addEventListener('load', function () {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadVLibras, { timeout: 5000 });
          } else {
            setTimeout(loadVLibras, 3000);
          }
        });
      })();
    </script>
